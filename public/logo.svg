<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient: Deep Night Sandstone -->
    <linearGradient id="zwincar-bg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#171C26"/>
      <stop offset="100%" stopColor="#0B0E14"/>
    </linearGradient>

    <!-- Speed Ribbon Gradient: Terracotta to Sunset Amber -->
    <linearGradient id="zwincar-ribbon-top" x1="10" y1="12" x2="38" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#FF7A45"/>
      <stop offset="50%" stopColor="#C9572C"/>
      <stop offset="100%" stopColor="#9E3510"/>
    </linearGradient>

    <linearGradient id="zwincar-ribbon-bot" x1="10" y1="24" x2="38" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#9E3510"/>
      <stop offset="50%" stopColor="#C9572C"/>
      <stop offset="100%" stopColor="#E58B24"/>
    </linearGradient>

    <!-- Golden Hour Accent -->
    <linearGradient id="zwincar-gold" x1="12" y1="12" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#F5A623"/>
      <stop offset="100%" stopColor="#D48810"/>
    </linearGradient>
  </defs>

  <!-- Container Box with Rounded Chamfer -->
  <rect width="48" height="48" rx="13" fill="url(#zwincar-bg)"/>
  <rect x="0.75" y="0.75" width="46.5" height="46.5" rx="12.25" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

  <!-- Subtle Horizon Road Glow -->
  <path d="M6 34C18 30 30 30 42 34" stroke="rgba(201,87,44,0.18)" stroke-width="2" stroke-linecap="round"/>

  <!-- Upper Aerodynamic Wing / Upper Z Bar -->
  <path d="M12 15C12 14.17 12.67 13.5 13.5 13.5H33.2C34.6 13.5 35.4 15.1 34.5 16.2L24.8 28H15.5L25.2 16.5H13.5C12.67 16.5 12 15.83 12 15Z" fill="url(#zwincar-ribbon-top)"/>

  <!-- Lower Aerodynamic Wing / Lower Z Bar -->
  <path d="M36 33C36 33.83 35.33 34.5 34.5 34.5H14.8C13.4 34.5 12.6 32.9 13.5 31.8L23.2 20H32.5L22.8 31.5H34.5C35.33 31.5 36 32.17 36 33Z" fill="url(#zwincar-ribbon-bot)"/>

  <!-- Dynamic Center Light Blade / Horizon Crossing -->
  <path d="M21 21.5L27 26.5" stroke="#FFFFFF" stroke-width="1.75" stroke-linecap="round" stroke-opacity="0.85"/>

  <!-- Sahara Golden Pips: Departure & Destination Nodes -->
  <circle cx="34.5" cy="14.8" r="2.2" fill="url(#zwincar-gold)"/>
  <circle cx="13.5" cy="33.2" r="2.2" fill="url(#zwincar-gold)"/>
</svg>
